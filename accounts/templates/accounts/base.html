<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>StudyRoomBooking</title></head>
<body>

      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
